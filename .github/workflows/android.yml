# Every push and pull request: run the tests and build a debug APK.
# A tag like v1.2.3: build the signed release APK and publish it as a GitHub release.
name: Android

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Named, not ubuntu-latest, so the image changes only when this line does (ubuntu-latest moved to 26.04 in Nov 2026).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null

      # Robolectric downloads its Android jar (about 200 MB) from Maven Central into ~/.m2 while the tests run, outside
      # the Gradle cache. Fetched on every run, it gets rate limited (HTTP 429) and every Robolectric test fails.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      - name: Test
        run: ./gradlew :protocol:test :app:testDebugUnitTest

      # Android lint and detekt fail on any finding not in their baselines (app/lint-baseline.xml, */detekt-baseline-*.xml).
      # detekt checks the debug build only: release differs by four stub files in app/src/release, and checking it too
      # compiled the whole app a second time, about 5 of this step's 7 minutes.
      - name: Lint and static analysis
        run: ./gradlew :app:lintDebug :app:detektDebug :protocol:detektMain

      # A German locale and a zone with a 45 minute offset, so a comma decimal mark or a fixed zone fails the build.
      - name: Tests under a German locale
        run: ./gradlew :app:testDebugUnitTest -PtestLocale=de-DE

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/

      # Only when lint ran: a failed test step stops before it, and a missing report would hide that failure.
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('app/build/reports/lint-results-debug.sarif') != '' }}
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: openstrap-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENSTRAP_KEYSTORE_BASE64 }}
          OPENSTRAP_KEYSTORE_PASSWORD: ${{ secrets.OPENSTRAP_KEYSTORE_PASSWORD }}
          OPENSTRAP_KEY_ALIAS: ${{ secrets.OPENSTRAP_KEY_ALIAS }}
          OPENSTRAP_KEY_PASSWORD: ${{ secrets.OPENSTRAP_KEY_PASSWORD }}
        run: |
          # Never publish a debug-signed release.
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Release signing secrets are not set"; exit 1; fi
          export OPENSTRAP_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$OPENSTRAP_KEYSTORE"
          ./gradlew :app:assembleRelease -PappVersion=${{ github.ref_name }}
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OpenStrap-${{ github.ref_name }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Hand-written notes in docs/releases/<tag>.md when there are some, else GitHub's list of merged PRs.
        run: |
          notes="docs/releases/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "${{ github.ref_name }}" dist/* --title "OpenStrap ${{ github.ref_name }}" "$@" --verify-tag

permissions:
  contents: write
  # SARIF upload of the lint report.
  security-events: write
